rules:
  - id: gestionvpn-sql-dynamic-query
    languages: [javascript, typescript]
    message: >-
      SQL dinámico por concatenación/interpolación. Usa placeholders para valores
      y allowlists constantes para identificadores que no admiten parámetros.
    severity: ERROR
    metadata:
      category: security
      cwe: CWE-89
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: $REQ.$FIELD
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($SQL, ...)
              - pattern: $DB.execute($SQL, ...)
              - pattern: query($SQL, ...)
              - pattern: execute($SQL, ...)
          - focus-metavariable: $SQL
    pattern-sanitizers:
      - pattern: $SCHEMA.parse(...)
      - pattern: $SCHEMA.safeParse(...)
      - pattern: $VALUES.map(() => '?').join(',')
