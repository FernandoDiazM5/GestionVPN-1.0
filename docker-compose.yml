version: '3.8'

services:

  # ── Backend Node.js (host network para acceder al túnel WireGuard) ──────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vpn-backend
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: "3001"
      DATA_DIR: "/data"
      # originPolicy ya permite localhost en desarrollo. Para otro origen de
      # desarrollo, definir CORS_ORIGINS externamente; nunca fijarlo aquí,
      # porque este archivo podría mezclarse por error con el de producción.
    volumes:
      - vpn-data:/data

  # ── Frontend nginx (sirve el build de React + proxy /api → backend) ─────────
  frontend:
    build:
      context: .
      dockerfile: vpn-manager/Dockerfile
      args:
        VITE_API_URL: ""
    container_name: vpn-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    extra_hosts:
      - "backend:host-gateway"
    networks:
      - vpn-net

volumes:
  vpn-data:
    driver: local

networks:
  vpn-net:
    driver: bridge
