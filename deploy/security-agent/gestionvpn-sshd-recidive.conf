[INCLUDES]
before = common.conf

[Definition]
# Cuenta exclusivamente bans automáticos del jail sshd. Los bloqueos manuales
# del panel no deben convertir por sí solos una dirección en reincidente.
failregex = ^%(__prefix_line)s(?:\s*fail2ban\.actions\s*%(__pid_re)s?:\s+)?NOTICE\s+\[sshd\]\s+Ban\s+<HOST>\s*$
datepattern = ^{DATE}
ignoreregex =
