# Compatibilidad temporal con acciones creadas antes de separar los vectores.
[gestionvpn-web-1h]
enabled = true
filter = sshd
backend = systemd
maxretry = 999999
bantime = 1h
action = ufw

[gestionvpn-web-auth]
enabled = true
filter = sshd
backend = systemd
maxretry = 999999
bantime = -1
action = ufw

[gestionvpn-web-rate]
enabled = true
filter = sshd
backend = systemd
maxretry = 999999
bantime = 1h
action = ufw

[gestionvpn-web-scan]
enabled = true
filter = sshd
backend = systemd
maxretry = 999999
bantime = 6h
action = ufw

[gestionvpn-web-scan-24h]
enabled = true
filter = sshd
backend = systemd
maxretry = 999999
bantime = 24h
action = ufw

[gestionvpn-web-sensitive]
enabled = true
filter = sshd
backend = systemd
maxretry = 999999
bantime = 1h
action = ufw

[gestionvpn-web-recidive]
enabled = true
filter = sshd
backend = systemd
maxretry = 999999
bantime = -1
action = ufw
