name: joinpoint-instance

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?required}
      MARIADB_DATABASE: vpn_manager
      MARIADB_USER: vpn_app
      MARIADB_PASSWORD: ${DB_APP_PASSWORD:?required}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    command: >-
      --innodb-buffer-pool-size=256M --max-connections=50
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    security_opt:
      - no-new-privileges:true

  backend:
    image: ${JOINPOINT_BACKEND_IMAGE:?required}
    restart: unless-stopped
    network_mode: host
    env_file:
      - ${JOINPOINT_SERVER_ENV_FILE:?required}
    environment:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: ${DB_HOST_PORT:-3307}
      MYSQL_USER: vpn_app
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:?required}
      MYSQL_DATABASE: vpn_manager
    volumes:
      - backend-data:/data
      - ${WG0_INTENT_DIR:-/opt/wg0-autosync}:/wg0sync
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    image: ${JOINPOINT_FRONTEND_IMAGE:?required}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${JOINPOINT_TLS_DIR:?required}:/etc/nginx/ssl:ro
      - ${JOINPOINT_NGINX_CONFIG:?required}:/etc/nginx/conf.d/default.conf:ro
      - ${JOINPOINT_ACME_CHALLENGE_DIR:?required}:/var/www/certbot:ro
    extra_hosts:
      - "backend:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  instance-agent:
    image: ${JOINPOINT_AGENT_IMAGE:?required}
    restart: unless-stopped
    read_only: true
    init: true
    environment:
      JOINPOINT_INSTANCE_ID: ${JOINPOINT_INSTANCE_ID:?required}
      JOINPOINT_CENTRAL_URL: ${JOINPOINT_CENTRAL_URL:?required}
      JOINPOINT_INSTANCE_PRIVATE_KEY_FILE: /run/secrets/instance-private.pem
      JOINPOINT_AGENT_STATE_DIRECTORY: /var/lib/joinpoint-agent
      JOINPOINT_SOFTWARE_VERSION: ${JOINPOINT_SOFTWARE_VERSION:?required}
      JOINPOINT_SYNC_INTERVAL_SECONDS: ${JOINPOINT_SYNC_INTERVAL_SECONDS:-300}
    volumes:
      - ${JOINPOINT_INSTANCE_PRIVATE_KEY_FILE:?required}:/run/secrets/instance-private.pem:ro
      - ${JOINPOINT_AGENT_STATE_DIR:?required}:/var/lib/joinpoint-agent
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  db-data:
  backend-data:
