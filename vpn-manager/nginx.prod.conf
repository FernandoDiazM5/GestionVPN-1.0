# ── nginx producción — HTTPS + proxy /api + SSE ─────────────────────────────
#  El backend corre en network_mode: host → se alcanza vía host-gateway:3001
#  (definido como extra_hosts "backend:host-gateway" en docker-compose.prod.yml).

# Métricas operativas sin IP, usuario, query string, cookies ni payloads.
# Permiten separar latencia Nginx, backend y volumen transferido.
log_format navigation_perf
    'ts=$time_iso8601 method=$request_method uri=$uri status=$status '
    'request_time=$request_time upstream_time=$upstream_response_time bytes=$bytes_sent';

upstream backend {
    server backend:3001;
}

# Límite grueso previo a Node. Una clave vacía no consume memoria ni limita el
# resto de la API; los límites finos y persistentes viven en MySQL.
map $uri $auth_limit_key {
    default "";
    ~^/api/auth/(setup|login)$ $binary_remote_addr;
    ~^/api/auth/password-reset/(request|confirm)$ $binary_remote_addr;
    ~^/api/account/(login|register|verify|resend)$ $binary_remote_addr;
    ~^/api/team/accept$ $binary_remote_addr;
}
limit_req_zone $auth_limit_key zone=auth_coarse:10m rate=5r/s;

# HTTP www → dominio canónico
server {
    listen 80;
    server_name www.joinpoint.cloud;
    return 301 https://joinpoint.cloud$request_uri;
}

# HTTP → HTTPS
server {
    listen 80;
    server_name joinpoint.cloud 134-199-212-232.nip.io _;
    return 301 https://$host$request_uri;
}

# HTTPS www → dominio canónico
server {
    listen 443 ssl;
    http2 on;
    server_name www.joinpoint.cloud;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://joinpoint.cloud$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name joinpoint.cloud 134-199-212-232.nip.io _;
    access_log /var/log/nginx/access.log navigation_perf;

    # Certificado (Let's Encrypt si hay dominio, o autofirmado para IP — ver §6)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión compatible con la imagen oficial nginx:alpine.
    # text/event-stream se excluye deliberadamente de gzip_types: SSE debe
    # entregarse inmediatamente y sin acumulación de eventos.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/gestionvpn-security-headers.conf;
        try_files /index.html =404;
    }

    # Compatibilidad temporal: algunos navegadores conservan en caché el 301
    # histórico "/" → "/GestionVPN-1.0/". Servir el shell aquí evita un bucle
    # con ese caché; tras login React canoniza a /dm/<workspace>/<módulo>.
    location ^~ /GestionVPN-1.0/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/gestionvpn-security-headers.conf;
        try_files /index.html =404;
    }

    # El HTML descubre los hashes de la versión actual y siempre debe
    # revalidarse. Los assets versionados de abajo sí conservan caché anual.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/gestionvpn-security-headers.conf;
        try_files $uri =404;
    }

    # SPA (React Router): login en / y workspace en /dm/<slug>/<módulo>.
    # Las rutas típicas de exploración maliciosa se envían al backend para
    # registrarlas y responder 404, en vez de entregar el shell de la SPA.
    location ~* ^/(\.env|\.git|wp-admin|wp-login\.php|phpmyadmin|adminer|cgi-bin)(/|$) {
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compatibilidad con navegadores que solicitan el icono convencional.
    location = /favicon.ico {
        return 302 /favicon.svg;
    }

    # Assets con caché agresivo
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/gestionvpn-security-headers.conf;
        try_files $uri =404;
    }

    # Proxy inverso al backend
    location /api/ {
        limit_req zone=auth_coarse burst=20 nodelay;
        limit_req_status 429;
        proxy_pass         http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Un único proxy confiable: sobrescribe cualquier X-Forwarded-For que
        # haya enviado el cliente y entrega sólo su IP de socket a Express.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # ── CRÍTICO para SSE (/tunnel/events, node/scan-stream,
        #    ap-monitor/watch, node/provision/:id/progress, router/check) ──
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection '';
        chunked_transfer_encoding off;

        proxy_read_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
    }

    # /metrics solo interno
    location /metrics {
        proxy_pass http://backend/metrics;
        allow 127.0.0.1;
        deny all;
    }

    include /etc/nginx/snippets/gestionvpn-security-headers.conf;
    server_tokens off;
    client_max_body_size 10M;
}
