# Canary Firebase completamente aislado de producción.
# Uso:
#   docker compose --env-file .env.staging -p gestionvpn-staging \
#     -f docker-compose.staging.yml up -d --build
#
# Requiere:
#   server/.env.staging
#   ssl-staging/fullchain.pem y ssl-staging/privkey.pem
#   STAGING_GOOGLE_APPLICATION_CREDENTIALS apuntando a ADC/WIF fuera del repo

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${STAGING_DB_ROOT_PASSWORD:?required}
      MARIADB_DATABASE: vpn_manager_staging
      MARIADB_USER: vpn_staging
      MARIADB_PASSWORD: ${STAGING_DB_APP_PASSWORD:?required}
    volumes:
      - db-staging-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    command: >
      --innodb-buffer-pool-size=128M
      --max-connections=30
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ${STAGING_SERVER_ENV_FILE:-server/.env.staging}
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: vpn_manager_staging
    volumes:
      - backend-staging-data:/data
      - type: bind
        source: ${STAGING_GOOGLE_APPLICATION_CREDENTIALS:?required}
        target: /run/secrets/google-application-credentials.json
        read_only: true
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: vpn-manager/Dockerfile.prod
      args:
        VITE_API_URL: ""
        VITE_FEDERATED_AUTH_ENABLED: "${VITE_FEDERATED_AUTH_ENABLED:-false}"
        VITE_FIREBASE_API_KEY: "${VITE_FIREBASE_API_KEY:-}"
        VITE_FIREBASE_AUTH_DOMAIN: "${VITE_FIREBASE_AUTH_DOMAIN:-}"
        VITE_FIREBASE_PROJECT_ID: "${VITE_FIREBASE_PROJECT_ID:-}"
        VITE_FIREBASE_APP_ID: "${VITE_FIREBASE_APP_ID:-}"
        VITE_FIREBASE_TENANT_ID: "${VITE_FIREBASE_TENANT_ID:-}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STAGING_HTTP_PORT:-8081}:80"
      - "${STAGING_HTTPS_PORT:-8444}:443"
    volumes:
      - ./ssl-staging:/etc/nginx/ssl:ro
    depends_on:
      - backend

volumes:
  db-staging-data:
  backend-staging-data:
